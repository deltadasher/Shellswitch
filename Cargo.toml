[package]
name = "shellswitch"
version = "0.2.6"
edition = "2024"
description = "Evidence-based Linux desktop shell discovery and transactional switching"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
memchr = "2"

[dev-dependencies]
tempfile = "3"
